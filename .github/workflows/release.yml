name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            exe: ResourceFetcher
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            name: win-x64
            exe: ResourceFetcher.exe
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-rs (the rustls crypto provider) compiles C and needs a MinGW
      # linker plus nasm for the x86_64 assembler paths.
      - name: Install MinGW toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nasm cmake

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage files
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          cp README.md README.en.md dist/

      - name: Archive
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/}"
          name="ResourceFetcher-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -9 -r "../${name}.zip" .
          else
            tar czf "../${name}.tar.gz" .
          fi
          echo "artifact=${name}.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Checksum
        shell: bash
        run: |
          cd "$(dirname "$artifact")"
          sha256sum "$(basename "$artifact")" > "SHA256SUMS-${{ matrix.name }}"
          cat "SHA256SUMS-${{ matrix.name }}"

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip
            SHA256SUMS-*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          cd artifacts
          cat SHA256SUMS-* > SHA256SUMS
          rm SHA256SUMS-*
          ls -la

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
