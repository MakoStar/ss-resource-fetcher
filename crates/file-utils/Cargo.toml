[package]
name = "file-utils"
version = "0.1.0"
edition = "2024"
description = "File system helpers: read/write, hashing and JSON persistence."

[lib]
crate-type = ["lib"]

[dependencies]
log = "0.4.34"
anyhow = "1.0.104" 
hex = "0.4.3"
md-5 = "0.11.0"
sha2 = "0.11.0"
serde = {  version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"

