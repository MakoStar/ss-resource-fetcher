[package]
name = "logger"
version = "0.1.0"
edition = "2024"
description = "Colored terminal logger built on top of env_logger."

[lib]
crate-type = ["lib"]

[dependencies]
log = "0.4.34"
unicode-width = "0.2.2"
env_logger = "0.11"
chrono = "0.4"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
