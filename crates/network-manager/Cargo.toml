[package]
name = "network-manager"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
log = "0.4.34"
url = "2.5.8"
bytes = "1.12.1"
thiserror = "2.0.20"
reqwest-retry = "0.9.1"
reqwest-middleware = "0.5.2"
serde_json = "1.0.151"
serde = {  version = "1.0.229", features = ["derive"]}
reqwest = { version = "0.13.4", features = ["json", "multipart", "form", "query"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
